<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volley Clash — 2D Volleyball</title>
<style>
:root{color-scheme:dark;--ink:#f5f7ff;--muted:#a9b4d0;--line:#31416b;--cyan:#55e6df;--pink:#ff739d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#263d70 0,#111a35 45%,#080d1e 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);display:grid;place-items:center;padding:22px}
main{width:min(100%,1040px)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 14px;flex-wrap:wrap}
h1{font-size:clamp(24px,4vw,38px);margin:0;letter-spacing:-1.5px}h1 span{color:var(--cyan)}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{border:1px solid var(--line);background:#172344;padding:8px 12px;border-radius:999px;font-size:12px;color:#cbd6f5}
.gamebox{position:relative;border:1px solid #415487;border-radius:18px;overflow:hidden;box-shadow:0 22px 70px #0008;background:#8fd8ee}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#081127b8;backdrop-filter:blur(5px);padding:18px}
.modal{max-width:430px;text-align:center;background:#111a35ed;border:1px solid #53699e;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}
.modal h2{font-size:28px;margin:0 0 8px}.modal p{color:#c2cde8;line-height:1.5;margin:8px 0 18px}
button{border:0;border-radius:11px;padding:11px 18px;font-weight:800;color:#071326;background:var(--cyan);cursor:pointer;font-size:14px}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#27375f;color:#e9efff;border:1px solid #4a5e91}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.below{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.card{background:#111a35bd;border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.card h3{font-size:13px;margin:0 0 8px;color:#e9efff}.keys{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:1.8}
kbd{background:#24345c;border:1px solid #52689b;border-bottom-width:3px;border-radius:6px;padding:2px 7px;color:white;font:700 11px ui-monospace,monospace}
@media(max-width:620px){body{padding:10px}.below{grid-template-columns:1fr}.pill{display:none}.card{padding:10px 12px}}

.character-pick{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.pick{flex:1;min-width:220px;background:#111a35bd;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pick label{display:block;font-size:12px;color:#cbd6f5;margin-bottom:7px;font-weight:700}
.pick select{width:100%;background:#24345c;color:white;border:1px solid #52689b;border-radius:8px;padding:9px;font:inherit}
@media(max-width:620px){.character-pick{display:grid;grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><h1>VOLLEY <span>CLASH</span></h1><div class="sub">A fast, local 2-player arcade volleyball game</div></div><div class="pill">FIRST TO 7 · WIN BY 2</div></header>
<div class="gamebox">
<canvas id="game" width="960" height="540" aria-label="2D volleyball game"></canvas>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">Ready to serve?</h2><p id="modalText">Jump, bump and spike your way to victory. Play against a friend on the same keyboard.</p><div class="actions"><button id="startBtn">START MATCH</button><button class="secondary" id="howBtn">HOW TO PLAY</button></div></div></div>
</div>
<div class="below">
<section class="card"><h3><span style="color:#55e6df">PLAYER 1 · BLUE</span></h3><div class="keys"><kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>F</kbd> hit</div></section>
<section class="card"><h3><span style="color:#ff739d">PLAYER 2 · PINK</span></h3><div class="keys"><kbd>←</kbd><kbd>→</kbd> move <kbd>↑</kbd> jump <kbd>/</kbd> hit</div></section>
</div>
</main>

function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}

function collidePlayer(p){
 let dx=ball.x-p.x,dy=ball.y-(p.y+p.r),d=Math.hypot(dx,dy),min=ball.r+p.r+1;
 if(d<min){let nx=dx/(d||1),ny=dy/(d||1);ball.x=p.x+nx*min;ball.y=p.y+p.r+ny*min;let dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.8*dot*nx;ball.vy-=1.8*dot*ny}ball.vx+=p.vx*.32;ball.vy-=1.1;if(Math.abs(ball.vx)<3)ball.vx+=(p.x<NET_X?1:-1)*2.5}
 if(keys[p.hit]&&p.hitTimer<=0&&d<90){p.hitTimer=18;let nx=dx/(d||1),ny=dy/(d||1);ball.vx=nx*8+p.face*2.5;ball.vy=Math.min(-7,ny*7-4);ball.x+=nx*8;ball.y+=ny*8}
}
function point(winner){score[winner]++;if((score[winner]>=7)&&(Math.abs(score[0]-score[1])>=2)){matchOver=true;running=false;show(winner===0?'BLUE TEAM WINS!':'PINK TEAM WINS!',`Final score: ${score[0]} – ${score[1]}. Great match!`,'NEW MATCH');return}running=false;serveSide=1-winner;show(winner===0?'POINT BLUE!':'POINT PINK!',`Score: ${score[0]} – ${score[1]}. Get ready for the next serve.`,'NEXT POINT')}
function update(dt){
 const step=Math.min(dt/16.67,2);

   p.vx=0;if(keys[p.left])p.vx=-5.3;if(keys[p.right])p.vx=5.3;

   if(p.y+p.r*2>=FLOOR){p.y=FLOOR-p.r*2;p.vy=0;p.onGround=true}
   p.hitTimer=Math.max(0,p.hitTimer-step);
 });
 ball.vy+=.25*step;ball.x+=ball.vx*step;ball.y+=ball.vy*step;ball.spin+=ball.vx*.012*step;

 if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.8}
 if(Math.abs(ball.x-NET_X)<ball.r+7&&ball.y>FLOOR-NET_H-ball.r){if(ball.y<FLOOR-NET_H+8){ball.y=FLOOR-NET_H-ball.r;ball.vy=-Math.abs(ball.vy)*.55}else{ball.x=ball.x<NET_X?NET_X-ball.r-8:NET_X+ball.r+8;ball.vx*=-.65}}
 players.forEach(collidePlayer);
 if(ball.y+ball.r>=FLOOR){let winner=ball.x<NET_X?1:0;point(winner)}
 if(ball.y<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.7}
}
function loop(t){if(!running){draw();requestAnimationFrame(loop);return}let dt=t-last;last=t;if(!paused)update(dt);draw();requestAnimationFrame(loop)}
